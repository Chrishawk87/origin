<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Origin</title>
<style>
  :root{
    --bg:#0e0f13; --panel:#16181f; --panel2:#1c1f28; --line:#282c37;
    --text:#e7e9ee; --dim:#8b91a1; --accent:#7c9cff; --accent2:#5ad1a0;
    --warn:#f0b866; --user:#243044;
  }
  *{box-sizing:border-box}
  body{margin:0;height:100vh;display:flex;font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
       background:var(--bg);color:var(--text);overflow:hidden}
  #side{width:270px;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column}
  #brand{padding:16px 18px;font-weight:700;font-size:20px;letter-spacing:.5px;border-bottom:1px solid var(--line)}
  #brand span{color:var(--accent)}
  .side-h{padding:12px 16px 6px;font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--dim)}
  #projects{flex:1;overflow:auto;padding:0 8px}
  .proj{padding:10px 12px;border-radius:8px;cursor:pointer;margin:2px 0;font-size:14px}
  .proj:hover{background:var(--panel2)}
  .proj.active{background:var(--user);color:#fff}
  .proj small{display:block;color:var(--dim);font-size:11px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .side-actions{padding:10px;border-top:1px solid var(--line);display:flex;gap:6px;flex-wrap:wrap}
  button{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:8px;
         padding:8px 12px;cursor:pointer;font-size:13px}
  button:hover{border-color:var(--accent)}
  button.primary{background:var(--accent);color:#0e0f13;border-color:var(--accent);font-weight:600}
  #main{flex:1;display:flex;flex-direction:column;min-width:0}
  #top{display:flex;align-items:center;gap:14px;padding:10px 18px;border-bottom:1px solid var(--line);
       background:var(--panel);font-size:13px;color:var(--dim)}
  #top b{color:var(--text)}
  #top select{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:5px 8px}
  #chat{flex:1;overflow:auto;padding:24px;display:flex;flex-direction:column;gap:16px}
  .msg{max-width:820px;width:100%;align-self:center}
  .bubble{padding:12px 15px;border-radius:12px;white-space:pre-wrap;line-height:1.5;font-size:14.5px}
  .user .bubble{background:var(--user);align-self:flex-end}
  .user{display:flex;justify-content:flex-end}
  .assistant .bubble{background:var(--panel)}
  .role{font-size:11px;color:var(--dim);margin-bottom:4px}
  .tools{margin:6px 0 0;border-left:2px solid var(--line);padding-left:10px}
  .tool{font-size:12px;color:var(--dim);font-family:ui-monospace,Menlo,monospace;margin:3px 0}
  .tool .n{color:var(--accent2)}
  .produced{margin-top:10px;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--panel2)}
  .produced-h{font-size:12px;color:var(--dim);margin-bottom:8px;font-weight:600}
  .produced .art{margin-bottom:10px}
  .produced .art img,.produced .art video{max-width:100%;max-height:340px;border-radius:8px;display:block;border:1px solid var(--line)}
  .produced .art-row{display:flex;align-items:center;gap:8px;margin-top:4px}
  .produced .art-file{display:flex;align-items:center;gap:8px;padding:6px 4px;border-top:1px solid var(--line)}
  .produced .art-file:first-of-type{border-top:0}
  .produced .ic{font-size:16px}
  .produced .nm{flex:1;font-size:12.5px;word-break:break-all}
  .produced .sz{font-size:11px;color:var(--dim)}
  .produced .dlbtn{font-size:12px;padding:3px 10px;border-radius:7px;background:var(--accent);color:#fff;
    text-decoration:none;white-space:nowrap}
  .produced .dlbtn:hover{opacity:.9}
  details{margin-top:6px}
  summary{cursor:pointer;color:var(--dim);font-size:12px}
  pre{white-space:pre-wrap;background:var(--panel2);padding:8px;border-radius:8px;font-size:12px;color:var(--dim);
      max-height:240px;overflow:auto}
  .thinking{display:inline-block;vertical-align:middle}
  .thinking .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--accent);margin-right:4px;animation:blink 1.4s infinite both}
  .thinking .dot:nth-child(2){animation-delay:.2s}
  .thinking .dot:nth-child(3){animation-delay:.4s}
  @keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
  .tmr{color:var(--dim);font-size:13px;margin-left:6px}
  button:disabled{opacity:.5;cursor:default}
  #composer{display:flex;gap:10px;padding:14px 18px;border-top:1px solid var(--line);background:var(--panel)}
  #input{flex:1;background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:10px;
         padding:12px 14px;font-size:14.5px;resize:none;min-height:46px;max-height:180px;font-family:inherit}
  .attach{font-size:20px;line-height:1;padding:0 13px;font-weight:700}
  #attachbar{padding:8px 18px 0;display:flex;gap:6px;flex-wrap:wrap}
  .achip{background:var(--panel2);border:1px solid var(--line);border-radius:16px;padding:4px 10px;font-size:12px;color:var(--text)}
  .achip b{color:var(--dim);cursor:pointer;margin-left:5px}
  .achip b:hover{color:var(--warn)}
  .banner{background:#2a2015;color:var(--warn);padding:8px 18px;font-size:13px;border-bottom:1px solid var(--line)}
  .empty{margin:auto;text-align:center;color:var(--dim);max-width:440px}
  .empty h2{color:var(--text);font-weight:600}
  .chip{display:inline-block;background:var(--panel2);border:1px solid var(--line);border-radius:20px;
        padding:3px 10px;font-size:11px;margin:3px;color:var(--dim)}
  #files{width:300px;background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column}
  .files-h{display:flex;align-items:center;gap:6px;padding:12px 14px;border-bottom:1px solid var(--line);font-size:12px;color:var(--dim);text-transform:uppercase;letter-spacing:.6px}
  .mini{padding:4px 9px;font-size:12px}
  #filelist{flex:1;overflow:auto;padding:6px}
  .fitem{display:flex;align-items:center;gap:8px;padding:7px 9px;border-radius:8px;cursor:pointer;font-size:13px}
  .fitem:hover{background:var(--panel2)}
  .fitem .ic{width:18px;text-align:center}
  .fitem .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .fitem .sz{margin-left:auto;color:var(--dim);font-size:11px;white-space:nowrap}
  .fempty{color:var(--dim);font-size:13px;padding:16px;text-align:center;line-height:1.5}
  #v-body img,#v-body video{max-width:100%;border-radius:8px}
  #v-body pre{max-height:70vh;overflow:auto;background:var(--panel2);padding:10px;border-radius:8px;font-size:12px}
  .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:20}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px;width:420px}
  .modal h3{margin:0 0 14px}
  .modal label{display:block;font-size:12px;color:var(--dim);margin:10px 0 4px}
  .modal input,.modal textarea{width:100%;background:var(--panel2);color:var(--text);border:1px solid var(--line);
       border-radius:8px;padding:9px 11px;font-size:13.5px;font-family:inherit}
  .modal .row{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}

  /* ── Compliance feature ───────────────────────────────────────── */
  .ftabs{display:flex;gap:4px;padding:8px 10px 0}
  .ftab{flex:1;text-align:center;padding:6px 8px;font-size:12px;border-radius:8px 8px 0 0;
        cursor:pointer;color:var(--dim);border:1px solid transparent}
  .ftab.active{color:var(--text);background:var(--panel2);border-color:var(--line);border-bottom-color:var(--panel2)}
  #librarylist{flex:1;overflow:auto;padding:6px;display:none}
  .libgroup{font-size:10px;text-transform:uppercase;letter-spacing:.6px;color:var(--dim);
            padding:12px 8px 4px;position:sticky;top:0;background:var(--panel)}
  .libitem{display:flex;align-items:center;gap:8px;padding:8px 9px;border-radius:8px;cursor:grab;
           font-size:12.5px;border:1px solid transparent}
  .libitem:hover{background:var(--panel2);border-color:var(--line)}
  .libitem .ic{width:16px;text-align:center}
  .libitem .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
  .libitem:active{cursor:grabbing}
  #dropoverlay{position:fixed;inset:0;z-index:30;display:none;align-items:center;justify-content:center;
    background:rgba(124,156,255,.14);border:3px dashed var(--accent);pointer-events:none}
  #dropoverlay .box{background:var(--panel);border:1px solid var(--accent);border-radius:14px;
    padding:20px 28px;font-size:15px;color:var(--text)}
  /* Editor */
  #editor .modal{width:min(940px,95vw)}
  .ed-toolbar{display:flex;flex-wrap:wrap;gap:4px;margin:10px 0;padding-bottom:10px;border-bottom:1px solid var(--line)}
  .ed-toolbar button{padding:6px 10px;font-size:13px;min-width:34px}
  .ed-toolbar .sep{width:1px;background:var(--line);margin:0 4px}
  #ed-body{background:#fff;color:#111;border-radius:8px;padding:26px;min-height:52vh;max-height:64vh;
    overflow:auto;font-size:13px;line-height:1.5}
  #ed-body:focus{outline:2px solid var(--accent)}
  #ed-status{font-size:12px;color:var(--accent2);margin-left:auto;align-self:center}
  #sendmodal .modal{width:min(500px,94vw)}

</style>
</head>
<body>
  <div id="side">
    <div id="brand">◍ Orig<span>in</span></div>
    <div class="side-h">Projects</div>
    <div id="projects"></div>
    <div class="side-actions">
      <button class="primary" onclick="openNew()">＋ New</button>
      <button onclick="importProj()">Import</button>
      <button onclick="openAccounts()">🔌 Connectors</button>
      <input id="importfile" type="file" accept=".originproj,.zip" style="display:none" onchange="doImport(event)">
    </div>
  </div>

  <div id="main">
    <div id="top">
      <span>Role:
        <button id="rolesbtn" onclick="openRoles()" title="Choose one or more roles Origin should embody">🎭 <span id="roleschips">operator</span></button>
      </span>
      <span>Brain:
        <select id="coord" onchange="setCoord()"></select>
      </span>
      <label style="cursor:pointer" title="Rewrite your message into a stronger instruction before acting">
        <input type="checkbox" id="enhtoggle" onchange="saveEnh()" style="vertical-align:middle"> ✨ Enhance
      </label>
      <span id="toolinfo"></span>
      <span style="flex:1"></span>
      <span id="active-name"></span>
      <button id="sharebtn" onclick="shareProj()" style="display:none">Share ⇪</button>
    </div>
    <div id="warn" class="banner" style="display:none"></div>
    <div id="chat"></div>
    <div id="presets" style="display:none;padding:8px 18px 0"></div>
    <div id="attachbar" style="display:none"></div>
    <div id="composer">
      <button class="attach" onclick="document.getElementById('attachinput').click()" title="Attach photos or files to this message">＋</button>
      <input id="attachinput" type="file" multiple style="display:none" onchange="doAttach(event)">
      <textarea id="input" placeholder="Open a project, then tell Origin what to do…  (＋ to attach a photo/file as reference)"
                onkeydown="onKey(event)"></textarea>
      <button id="refinebtn" onclick="doRefine()" title="Rewrite your draft into a sharper instruction (then review & send)">✨ Refine</button>
      <button id="missionbtn" onclick="mission()" title="Executive loop: plan → act → critique → deliver">🎯 Mission</button>
      <button id="sendbtn" class="primary" onclick="send()">Send</button>
    </div>
  </div>

  <div id="files">
    <div class="ftabs">
      <div id="tab-workspace" class="ftab active" onclick="switchFilesTab('workspace')">Workspace</div>
      <div id="tab-library" class="ftab" onclick="switchFilesTab('library')">Asset Library</div>
    </div>
    <div class="files-h" id="workspace-h">Files
      <span style="flex:1"></span>
      <button class="mini" onclick="document.getElementById('uploadfiles').click()">Files</button>
      <button class="mini" onclick="document.getElementById('uploadfolder').click()">Folder</button>
    </div>
    <input id="uploadfiles" type="file" multiple style="display:none" onchange="doUpload(event,false)">
    <input id="uploadfolder" type="file" webkitdirectory style="display:none" onchange="doUpload(event,true)">
    <div id="filelist"><div class="fempty">Open a project to see its files.</div></div>
    <div id="librarylist"><div class="fempty">Loading templates…</div></div>
  </div>

  <div class="modal-bg" id="viewer">
    <div class="modal" style="width:min(880px,92vw);max-height:90vh;overflow:auto">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px">
        <b id="v-name"></b><span style="flex:1"></span>
        <button class="primary" id="v-dl">Download</button>
        <button onclick="closeViewer()">Close</button>
      </div>
      <div id="v-body"></div>
    </div>
  </div>

  <div class="modal-bg" id="accounts">
    <div class="modal" style="width:min(560px,92vw);max-height:88vh;overflow:auto">
      <h3>Connectors &amp; accounts</h3>
      <div id="acct-list"></div>
      <div class="row">
        <button onclick="testAll()">Test all models</button>
        <button class="primary" onclick="closeAccounts()">Close</button>
      </div>
    </div>
  </div>

  <div class="modal-bg" id="editor">
    <div class="modal" style="max-height:92vh;overflow:auto">
      <div style="display:flex;align-items:center;gap:10px">
        <b id="ed-title"></b>
        <span id="ed-status"></span>
      </div>
      <div class="ed-toolbar">
        <button title="Bold" onclick="fmt('bold')"><b>B</b></button>
        <button title="Italic" onclick="fmt('italic')"><i>I</i></button>
        <button title="Underline" onclick="fmt('underline')"><u>U</u></button>
        <div class="sep"></div>
        <button title="Heading" onclick="fmtBlock('H2')">H</button>
        <button title="Sub-heading" onclick="fmtBlock('H3')">h</button>
        <button title="Normal text" onclick="fmtBlock('P')">¶</button>
        <div class="sep"></div>
        <button title="Bulleted list" onclick="fmt('insertUnorderedList')">• List</button>
        <button title="Numbered list" onclick="fmt('insertOrderedList')">1. List</button>
        <div class="sep"></div>
        <button title="Undo" onclick="fmt('undo')">↶</button>
        <button title="Redo" onclick="fmt('redo')">↷</button>
      </div>
      <div id="ed-body" contenteditable="true"></div>
      <div class="row" style="justify-content:space-between">
        <div style="display:flex;gap:8px">
          <button onclick="downloadDocPdf()">Download PDF</button>
        </div>
        <div style="display:flex;gap:8px">
          <button onclick="closeEditor()">Close</button>
          <button onclick="saveDoc()">Save</button>
          <button class="primary" onclick="openSend()">Save &amp; Send ▸</button>
        </div>
      </div>
    </div>
  </div>

  <div class="modal-bg" id="sendmodal">
    <div class="modal">
      <h3>Send compliance document</h3>
      <label>Recipient email</label>
      <input id="send-to" type="email" placeholder="contractor@company.com">
      <label>Subject</label>
      <input id="send-subject" type="text" placeholder="Your completed compliance program">
      <label>Message</label>
      <textarea id="send-message" rows="4" placeholder="Attached is your finalized program. Let me know if you need anything."></textarea>
      <div id="send-status" style="font-size:12px;color:var(--dim);margin-top:8px"></div>
      <div class="row">
        <button onclick="closeSend()">Cancel</button>
        <button class="primary" id="send-go" onclick="doSend()">Render PDF &amp; Send</button>
      </div>
    </div>
  </div>

  <div class="modal-bg" id="modal">
    <div class="modal">
      <h3 id="modal-title">New project</h3>
      <div id="modal-body"></div>
      <div class="row">
        <button onclick="closeModal()">Cancel</button>
        <button class="primary" id="modal-ok">Create</button>
      </div>
    </div>
  </div>

<script>
let STATE=null, ACTIVE=null, BUSY=false, autoOpenTried=false;

// Token: read from URL once, then remember it in this browser (log in once).
let TOKEN='';
(function initToken(){
  const fromUrl=new URLSearchParams(location.search).get('token');
  if(fromUrl){
    TOKEN=fromUrl;
    try{ localStorage.setItem('origin_token', TOKEN); }catch(e){}
    // clean the token out of the address bar
    try{ history.replaceState({}, '', location.pathname); }catch(e){}
  } else {
    try{ TOKEN=localStorage.getItem('origin_token')||''; }catch(e){ TOKEN=''; }
  }
  if(!TOKEN){
    const t=prompt('Enter your Origin access token to sign in:');
    if(t){ TOKEN=t.trim(); try{ localStorage.setItem('origin_token', TOKEN); }catch(e){} }
  }
})();
function signOut(){ try{ localStorage.removeItem('origin_token'); localStorage.removeItem('origin_last_project'); }catch(e){} location.reload(); }

async function api(path, opts){
  opts = opts || {};
  if(TOKEN){ opts.headers = Object.assign({}, opts.headers||{}, {'X-Origin-Token': TOKEN}); }
  const r=await fetch(path,opts);
  const t=await r.text();
  try { return JSON.parse(t); }
  catch(e){ return {error: t || ('HTTP '+r.status)}; }
}

async function refresh(){
  STATE=await api('/api/state');
  // projects
  const pc=document.getElementById('projects'); pc.innerHTML='';
  STATE.projects.forEach(p=>{
    const d=document.createElement('div'); d.className='proj'+(ACTIVE&&ACTIVE.slug===p.slug?' active':'');
    d.innerHTML=`${p.name}<small>${p.workdir}</small>`;
    d.onclick=()=>openProject(p.slug); pc.appendChild(d);
  });
  // coordinator select
  const cs=document.getElementById('coord'); cs.innerHTML='';
  (STATE.workers||[]).forEach(w=>{const o=document.createElement('option');o.value=w;o.textContent=w;
    if(w===STATE.coordinator)o.selected=true;cs.appendChild(o);});
  if(!STATE.workers||!STATE.workers.length){const o=document.createElement('option');o.textContent='(single llm brain)';cs.appendChild(o);}
  // roles chips (active role(s))
  const active=STATE.active_roles||[];
  const chips=document.getElementById('roleschips');
  chips.textContent = active.length ? active.join(' + ') : 'operator';
  const et=document.getElementById('enhtoggle'); if(et) et.checked=enhOn();
  // tool info
  const t=STATE.tools||{}; const total=Object.values(t).reduce((a,b)=>a+b.length,0);
  document.getElementById('toolinfo').innerHTML=`<b>${total}</b> tools · `+
    Object.entries(t).map(([k,v])=>`<span class="chip">${k}:${v.length}</span>`).join('');
  // warn
  const wb=document.getElementById('warn');
  if(STATE.brain_error){wb.style.display='block';wb.textContent='⚠ '+STATE.brain_error;}
  else{wb.style.display='none';}
  // presets
  const pb=document.getElementById('presets'); pb.innerHTML='';
  if(ACTIVE && (STATE.presets||[]).length){
    pb.style.display='block';
    STATE.presets.forEach(p=>{
      const b=document.createElement('button'); b.textContent=p.label; b.style.marginRight='6px';
      b.onclick=()=>{const inp=document.getElementById('input');inp.value=p.prompt;inp.focus();};
      pb.appendChild(b);
    });
  } else { pb.style.display='none'; }
  if(!ACTIVE){
    let last=null; try{ last=localStorage.getItem('origin_last_project'); }catch(e){}
    if(!autoOpenTried && last && (STATE.projects||[]).some(p=>p.slug===last)){
      autoOpenTried=true; openProject(last); return;
    }
    renderEmpty();
  }
}

function renderEmpty(){
  document.getElementById('active-name').textContent='';
  document.getElementById('sharebtn').style.display='none';
  document.getElementById('chat').innerHTML=
    `<div class="empty"><h2>Welcome to Origin</h2>
     <p>Pick a project on the left, or create one, to start working.
     Origin can browse the web, gather info, run your terminal, and orchestrate
     multiple models — all in one place.</p></div>`;
}

async function openProject(slug){
  const r=await api('/api/projects/'+slug+'/open',{method:'POST'});
  if(!r || !r.opened){ renderEmpty(); return; }
  ACTIVE=r.opened;
  try{ localStorage.setItem('origin_last_project', slug); }catch(e){}
  document.getElementById('active-name').innerHTML='<b>'+ACTIVE.name+'</b>';
  document.getElementById('sharebtn').style.display='';
  const chat=document.getElementById('chat'); chat.innerHTML='';
  (r.transcript||[]).forEach(m=>addBubble(m.role,m.text));
  await refresh();
  loadFiles();
  scrollDown();
}

function addBubble(role,text){
  const chat=document.getElementById('chat');
  const w=document.createElement('div'); w.className='msg '+role;
  w.innerHTML=`<div class="bubble">${escapeHtml(text)}</div>`;
  chat.appendChild(w); return w;
}
function escapeHtml(s){return (s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
function scrollDown(){const c=document.getElementById('chat');c.scrollTop=c.scrollHeight;}

function onKey(e){ if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send();} }

function setBusy(b){
  BUSY=b;
  ['sendbtn','missionbtn'].forEach(id=>{const el=document.getElementById(id); if(el) el.disabled=b;});
}
function startThinking(label){
  const chat=document.getElementById('chat');
  const w=document.createElement('div'); w.className='msg assistant';
  w.innerHTML='<div class="bubble"><span class="thinking"><span class="dot"></span><span class="dot"></span><span class="dot"></span></span>'+
              '<span class="tmr">'+(label||'Origin is thinking')+'… 0s</span></div>';
  chat.appendChild(w); scrollDown();
  const t0=Date.now(); const tmr=w.querySelector('.tmr');
  tmr.dataset.label=label||'Origin is thinking';
  const iv=setInterval(()=>{ const s=Math.round((Date.now()-t0)/1000); tmr.textContent=(tmr.dataset.label||'Origin is thinking')+'… '+s+'s'; },1000);
  return {el:w, stop:()=>clearInterval(iv)};
}
async function apiTimed(path, opts, ms){
  opts=opts||{}; const ctrl=new AbortController(); opts.signal=ctrl.signal;
  const id=setTimeout(()=>ctrl.abort(), ms||240000);
  try{ return await api(path, opts); } finally{ clearTimeout(id); }
}

const sleep=ms=>new Promise(r=>setTimeout(r,ms));
// Human-readable label for the current step, so the thinking bubble shows life.
function stepLabel(events){
  const last=(events||[]).slice().reverse().find(e=>e.type==='tool'||e.type==='enhanced');
  if(!last) return 'Origin is thinking';
  if(last.type==='enhanced') return 'Refined — now working';

    web_fetch:'Reading a page',browse:'Browsing',shell:'Running a command',read_file:'Reading a file',
    write_file:'Writing a file',generate_image:'Generating an image',generate_video:'Generating video',
    consult:'Consulting another model',collaborate:'Collaborating with the other models',
    youtube_transcript:'Reading a YouTube transcript',http_request:'Calling an API',remember:'Saving to memory'};
  return (map[n]||('Using '+n))+'…';
}

async function send(){
  if(BUSY) return;
  const inp=document.getElementById('input'); const text=inp.value.trim();
  if(!text && !PENDING.length) return;
  if(!ACTIVE){alert('Open or create a project first.');return;}
  let msg=text;
  if(PENDING.length){
    msg=(text?text+'\n\n':'')+'📎 Attached to this message (in this project\'s workspace — read/use them as reference): '+PENDING.join(', ');
  }
  inp.value=''; const ub=addBubble('user', msg);
  PENDING=[]; renderAttachBar();
  const think=startThinking(enhOn()?'Refining your request, then working':'Origin is thinking'); setBusy(true);
  let enhancedShown=false;
  try{
    // 1) start the turn as a background job (short request — can't time out)
    const start=await apiTimed('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({message:msg, enhance:enhOn()})}, 30000);
    if(start && start.error){ think.stop(); think.el.remove(); addBubble('assistant','⚠️ '+start.error); setBusy(false); return; }
    const jid=start.job_id;
    // 2) poll for progress until done/error (no hard cap — a big task can take minutes)
    let r=null;
    while(true){
      await sleep(1500);
      let s;
      try{ s=await apiTimed('/api/chat/status/'+encodeURIComponent(jid),{}, 20000); }
      catch(e){ continue; } // transient poll hiccup — keep waiting
      // live label + show the refined prompt as soon as it exists
      const lbl=stepLabel(s.events);
      const tmr=think.el.querySelector('.tmr'); if(tmr) tmr.dataset.label=lbl;
      const enh=(s.events||[]).find(e=>e.type==='enhanced');
      if(enh && !enhancedShown){
        enhancedShown=true;
        ub.querySelector('.bubble').insertAdjacentHTML('beforeend',
          '<details style="margin-top:6px"><summary>✨ refined for a better result</summary>'+
          '<div style="color:var(--dim);font-size:12.5px;margin-top:5px;white-space:pre-wrap">'+escapeHtml(enh.text)+'</div></details>');
      }
      if(s.status==='done'||s.status==='error'){ r=s; break; }
    }
    think.stop(); think.el.remove();
    if(r.status==='error'){ addBubble('assistant','⚠️ '+(r.error||'Something went wrong.')); }
    else { renderTurn(r); }
  }catch(e){
    think.stop(); think.el.remove();
    addBubble('assistant','⚠️ '+(e && e.name==='AbortError'
      ? 'Couldn’t start that request — check your connection and try again.' : e));
  }
  setBusy(false); scrollDown();
  refresh(); loadFiles();
}

function renderTurn(r){
  const chat=document.getElementById('chat');
  const w=document.createElement('div'); w.className='msg assistant';
  let html='<div class="bubble">';
  const tools=(r.events||[]).filter(e=>e.type!=='text');
  if(tools.length){
    html+='<div class="tools">';
    (r.events||[]).forEach(e=>{
      if(e.type==='tool') html+=`<div class="tool">→ <span class="n">${e.name}</span> ${escapeHtml(JSON.stringify(e.args)).slice(0,180)}</div>`;
      if(e.type==='result') html+=`<details><summary>${e.name} result</summary><pre>${escapeHtml(e.result)}</pre></details>`;
    });
    html+='</div>';
  }
  html+='<div>'+escapeHtml(r.final||'(done)')+'</div>';
  html+=artifactsHtml(r.artifacts);
  html+='</div>';
  w.innerHTML=html; chat.appendChild(w);
}

// Show exactly what this turn produced — inline previews + view/download.
function artifactsHtml(arts){
  if(!arts || !arts.length || !ACTIVE) return '';
  const icons={image:'🖼️',video:'🎬',audio:'🎵',pdf:'📄',text:'📃',doc:'📝'};
  let h='<div class="produced"><div class="produced-h">📦 Produced this turn — click to view or download</div>';
  arts.forEach(a=>{
    const url=fileUrl(a.path,false), dl=fileUrl(a.path,true);
    if(a.kind==='image'){
      h+=`<div class="art"><a href="${url}" target="_blank"><img src="${url}" alt="${escapeHtml(a.name)}"></a>`+
         `<div class="art-row"><span class="nm">${escapeHtml(a.path)}</span><a class="dlbtn" href="${dl}">Download</a></div></div>`;
    } else if(a.kind==='video'){
      h+=`<div class="art"><video src="${url}" controls></video>`+
         `<div class="art-row"><span class="nm">${escapeHtml(a.path)}</span><a class="dlbtn" href="${dl}">Download</a></div></div>`;
    } else if(a.kind==='audio'){
      h+=`<div class="art"><audio src="${url}" controls style="width:100%"></audio>`+
         `<div class="art-row"><span class="nm">${escapeHtml(a.path)}</span><a class="dlbtn" href="${dl}">Download</a></div></div>`;
    } else {
      h+=`<div class="art-file"><span class="ic">${icons[a.kind]||'📎'}</span>`+
         `<span class="nm">${escapeHtml(a.path)}</span><span class="sz">${fmtSize(a.size)}</span>`+
         `<a class="dlbtn" href="${url}" target="_blank">Open</a><a class="dlbtn" href="${dl}">Download</a></div>`;
    }
  });
  h+='</div>';
  return h;
}

function initDrop(){
  const main=document.getElementById('main'); if(!main||main.dataset.dropInit) return;
  main.dataset.dropInit='1';
  let ov=document.getElementById('dropoverlay');
  if(!ov){ ov=document.createElement('div'); ov.id='dropoverlay';
    ov.innerHTML='<div class="box">Drop to add this template to <b id="drop-proj"></b></div>';
    document.body.appendChild(ov); }
  const show=on=>{ ov.style.display=on?'flex':'none';
    const dp=document.getElementById('drop-proj'); if(dp) dp.textContent=ACTIVE?ACTIVE.name:'your project'; };
  const hasTpl=e=>Array.from(e.dataTransfer.types||[]).includes('text/origin-template');
  main.addEventListener('dragover',e=>{ if(!hasTpl(e))return; e.preventDefault();
    e.dataTransfer.dropEffect='copy'; show(true); });
  main.addEventListener('dragleave',e=>{ if(e.target===main) show(false); });
  main.addEventListener('drop',e=>{ const tid=e.dataTransfer.getData('text/origin-template');
    if(!tid)return; e.preventDefault(); show(false); assignTemplate(tid); });
}

  const t=document.getElementById('ed-title').textContent;
  document.getElementById('send-subject').value='Your completed compliance program — '+t;
  document.getElementById('send-status').textContent='';
  document.getElementById('sendmodal').style.display='flex';
}
function closeSend(){ document.getElementById('sendmodal').style.display='none'; }
async function doSend(){
  const to=document.getElementById('send-to').value.trim();
  if(!to){ alert('Enter a recipient email.'); return; }
  await saveDoc();
  const btn=document.getElementById('send-go'); btn.disabled=true;
  const st=document.getElementById('send-status'); st.textContent='Rendering PDF and sending…';
  const r=await api('/api/projects/'+ACTIVE.slug+'/compliance/send',
    {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({
       path:EDIT_PATH, to:to,
       subject:document.getElementById('send-subject').value,
       message:document.getElementById('send-message').value })});
  btn.disabled=false;
  if(r&&r.sent){ st.style.color='var(--accent2)'; st.textContent='Sent to '+to+' ✓ (PDF also saved to the project)';
    loadFiles(); }
  else { st.style.color='var(--warn)';
    st.textContent=(r&&r.error?r.error:'Send failed.')+(r&&r.pdf_path?' The PDF was saved to the project.':''); loadFiles(); }
}

function initCompliance(){ initDrop(); }

refresh();
initCompliance();
</script>
</body>
</html>

  #   enabled: true

# ─── REST / HTTP APIs ────────────────────────────────────────────────────
# Wire in ANY HTTP API here — no code needed. The agent calls them through
# the `http_request` tool by their name.
rest_apis:
  github:
    base_url: https://api.github.com
    description: "GitHub REST API v3"
    headers:
      Authorization: "Bearer ${GITHUB_TOKEN}"
      Accept: "application/vnd.github+json"

  # ── App connectors: wire in dozens of apps here. ANY worker (Claude AND
  #    GPT) can use them, because all tools are shared. Ad platforms, CRMs,
  #    analytics — anything with an HTTP API. Uncomment and add your keys.

# Config used when Origin runs on a cloud host (Railway/Render/etc.).
# The brain is a cloud model via API key set as a host environment variable.
# Set ANTHROPIC_API_KEY and/or OPENAI_API_KEY in your host; Origin uses
# whichever is present (coordinator prefers Claude, falls back to GPT).

llm:
  provider: anthropic
  anthropic:
    model: claude-sonnet-4-5
    api_key_env: ANTHROPIC_API_KEY
    max_tokens: 4096
  openai:
    model: gpt-4.1
    api_key_env: OPENAI_API_KEY
    max_tokens: 4096

workers:
  claude:
    provider: anthropic
    model: claude-sonnet-4-5
    api_key_env: ANTHROPIC_API_KEY
    role: "reasoning, writing, review"
  gpt:
    provider: openai
    model: gpt-4.1
    api_key_env: OPENAI_API_KEY
    role: "fast drafts, brainstorming"
  grok:
    provider: grok
    model: grok-4
    api_key_env: XAI_API_KEY
    role: "real-time takes, contrarian angles"
  gemini:
    provider: gemini
    # gemini-3.6-flash is Google's current GA Flash model (the 2.x Flash line was
    # retired — old pins now 404). The provider forces reasoning_effort="none",
    # which keeps "thinking" off so no thought_signature is produced, sidestepping
    # the OpenAI-compat bug that would otherwise break multi-turn tool calls.
    model: gemini-3.6-flash
    api_key_env: GEMINI_API_KEY
    role: "long-context, multimodal, fast"

# Photo Audit vision layer — self-healing. The tool tries these brains in order
# and uses the first that works, so a retired Google model or a lapsed key can
# never hard-fail the feature for a customer. `gemini-flash-latest` is an alias
# that always points at Google's newest Flash model, so upgrades are automatic.
# To prefer a different/better model later, edit the order or models below.
vision:
  order: [gemini, claude, gpt]
  models:
    gemini: gemini-flash-latest

orchestrator:
  # Gemini is the free everyday brain (runs the agent by default). Switch to
  # Claude from the Brain dropdown when you want a paid, higher-reasoning pass
  # or a document review. Falls back to whichever key is actually set.
  coordinator: gemini
  collab_workers: [claude, gpt, grok, gemini]
  synthesizer: claude

# The hosted container has no display/browser; keep those off.
web:
  enabled: true
  search_backend: ddg
  browser: false

research:
  default_ttl_hours: 24
  daily_refresh: false

media:
  image_model: gpt-image-1
  video_provider: sora     # sora | veo
  video_model: sora-2
  veo_model: veo-3.1-generate-preview

enhancer:
  enabled: true
  # Prompt-enhancement now follows the ACTIVE brain (the Brain dropdown) by
  # default, so picking Claude enhances with Claude instead of a hardwired
  # free-tier model that can rate-limit and hang the turn. To force one model,
  # set `pin: true` and a `worker:` below.
  pin: false
  worker: gemini
  timeout_seconds: 12   # hard cap; if enhancement is slower, send the raw message
